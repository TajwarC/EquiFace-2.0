[project]
name = "equiface"
version = "0.1.1"
description = "A package to calculate FPR and FNR for TFLite face verification models"
readme = "README.md"
authors = [
    { name = "Tajwar Choudhury" }
]
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "tqdm",
    "pyyaml",
    "tensorflow",
    "ultralytics",
    "deepface",
    "datasets",
    "huggingface-hub",
]

[project.scripts]
equiface = "equiface.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
